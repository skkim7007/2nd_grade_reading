<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영어 본문 단계별 학습</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f1f5f9;
            user-select: none; /* 전체 선택 방지 */
            -webkit-user-select: none;
        }

        /* 네오 브루탈리즘 (게임 스타일) UI */
        .game-box {
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0px #1e293b;
            border-radius: 16px;
        }

        .game-btn {
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0px #1e293b;
            transition: all 0.1s ease-in-out;
            cursor: pointer;
        }

        .game-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #1e293b;
        }

        .game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 4px 4px 0px #1e293b;
        }

        /* 코인 애니메이션 */
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            80% { opacity: 1; transform: translateY(-40px) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
        }
        
        .coin-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 2px 2px 0 #b45309, -2px -2px 0 #b45309, 2px -2px 0 #b45309, -2px 2px 0 #b45309;
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
            z-index: 9999;
        }

        /* 블록 스타일 */
        .word-block {
            border: 3px solid #1e293b;
            box-shadow: 2px 2px 0px #1e293b;
            transition: transform 0.1s;
        }
        
        .word-block:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #1e293b;
        }

        /* 아바타 슬라임 모양 */
        .slime {
            width: 80px;
            height: 70px;
            border-radius: 50% 50% 10% 10% / 60% 60% 10% 10%;
            border: 4px solid #1e293b;
            box-shadow: 4px 4px 0px #1e293b;
            position: relative;
            background-color: #a7f3d0; /* 기본색 */
        }
        
        .slime::after, .slime::before {
            content: '';
            position: absolute;
            background: #1e293b;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            top: 30px;
        }
        .slime::before { left: 20px; }
        .slime::after { right: 20px; }

        .item-slot {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }

        /* 힌트 밑줄 스타일 (끊김 방지용 border-bottom 사용) */
        .error-group {
            border-bottom: 4px solid #f43f5e; /* Rose-500 */
            color: #e11d48; /* Rose-600 */
            display: inline-block;
            margin: 0 2px;
            padding-bottom: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- 1. 로그인 페이지 -->
    <div id="page-login" class="w-full max-w-md flex flex-col items-center justify-center mt-10">
        <div class="bg-white p-8 game-box w-full">
            <h1 class="text-3xl font-black text-center text-indigo-600 mb-2">ENG MASTER 🎮</h1>
            <p class="text-center text-slate-500 font-bold mb-8">영어 본문 완전 정복!</p>
            
            <div class="mb-4">
                <label class="block text-slate-700 font-bold mb-2">학번</label>
                <input type="number" id="input-id" class="w-full border-4 border-slate-800 rounded-xl p-3 font-bold text-lg focus:outline-none focus:border-indigo-500 transition-colors" placeholder="예: 20101">
            </div>
            <div class="mb-8">
                <label class="block text-slate-700 font-bold mb-2">이름</label>
                <input type="text" id="input-name" class="w-full border-4 border-slate-800 rounded-xl p-3 font-bold text-lg focus:outline-none focus:border-indigo-500 transition-colors" placeholder="예: 김오션">
            </div>
            
            <button onclick="login()" class="game-btn w-full bg-indigo-500 hover:bg-indigo-600 text-white font-black text-xl py-4 rounded-xl">
                게임 시작! 🚀
            </button>
        </div>
    </div>

    <!-- 2. 단원 선택 페이지 -->
    <div id="page-unit" class="hidden w-full max-w-3xl flex-col items-center">
        <!-- 상단 유저 정보 및 상점 바 -->
        <div class="w-full flex justify-between items-center bg-white p-4 game-box mb-6">
            <div class="flex items-center gap-4">
                <div id="mini-avatar" class="slime" style="transform: scale(0.6); margin: -15px;">
                    <div class="item-slot" id="mini-item"></div>
                </div>
                <div>
                    <div id="user-info-display" class="font-black text-slate-800 text-lg"></div>
                    <div class="text-amber-500 font-black flex items-center gap-1">
                        <i class="fas fa-coins"></i> <span id="coin-display">0</span> 코인
                    </div>
                </div>
            </div>
            <button onclick="showPage('page-shop')" class="game-btn bg-amber-400 text-amber-900 px-4 py-2 rounded-xl font-black flex items-center gap-2">
                <i class="fas fa-store"></i> 상점 가기
            </button>
        </div>

        <h2 class="text-3xl font-black text-slate-800 mb-6">단원 선택 📚</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
            <button onclick="selectUnit(5)" class="game-btn bg-white hover:bg-indigo-50 p-6 rounded-2xl flex flex-col items-center justify-center">
                <span class="text-4xl mb-2">🏞️</span>
                <span class="text-2xl font-black text-slate-800">5단원</span>
                <span class="text-slate-500 font-bold mt-1">나의 고향, 춘천</span>
            </button>
            <button onclick="selectUnit(6)" class="game-btn bg-white hover:bg-indigo-50 p-6 rounded-2xl flex flex-col items-center justify-center">
                <span class="text-4xl mb-2">🛹</span>
                <span class="text-2xl font-black text-slate-800">6단원</span>
                <span class="text-slate-500 font-bold mt-1">첫 스케이트보드</span>
            </button>
            <button onclick="selectUnit(7)" class="game-btn bg-white hover:bg-indigo-50 p-6 rounded-2xl flex flex-col items-center justify-center">
                <span class="text-4xl mb-2">🐻‍❄️</span>
                <span class="text-2xl font-black text-slate-800">7단원</span>
                <span class="text-slate-500 font-bold mt-1">추운 곳에 사는 동물들</span>
            </button>
            <button onclick="selectUnit(8)" class="game-btn bg-white hover:bg-indigo-50 p-6 rounded-2xl flex flex-col items-center justify-center">
                <span class="text-4xl mb-2">🐨</span>
                <span class="text-2xl font-black text-slate-800">8단원</span>
                <span class="text-slate-500 font-bold mt-1">가격 비교하기</span>
            </button>
        </div>
    </div>

    <!-- 3. 학습 모드 선택 페이지 -->
    <div id="page-mode" class="hidden w-full max-w-3xl flex-col items-center">
        <div class="w-full flex items-center mb-6">
            <button onclick="showPage('page-unit')" class="game-btn bg-white p-3 rounded-xl font-bold"><i class="fas fa-arrow-left"></i> 뒤로</button>
            <h2 id="mode-title" class="text-2xl font-black text-slate-800 flex-1 text-center pr-12"></h2>
        </div>
        
        <div class="flex flex-col gap-4 w-full">
            <button onclick="selectMode(1)" class="game-btn bg-white p-5 rounded-2xl flex items-center justify-between">
                <div class="flex items-center gap-4"><span class="text-3xl">👀</span><span class="text-xl font-black text-slate-700">1. 한 줄 해석 읽기</span></div>
                <i class="fas fa-chevron-right text-slate-300"></i>
            </button>
            <button onclick="selectMode(2)" class="game-btn bg-white p-5 rounded-2xl flex items-center justify-between">
                <div class="flex items-center gap-4"><span class="text-3xl">⌨️</span><span class="text-xl font-black text-slate-700">2. 영어 문장 따라 쓰기</span></div>
                <i class="fas fa-chevron-right text-slate-300"></i>
            </button>
            <button onclick="selectMode(3)" class="game-btn bg-white p-5 rounded-2xl flex items-center justify-between">
                <div class="flex items-center gap-4"><span class="text-3xl">🧩</span><span class="text-xl font-black text-slate-700">3. 구(phrase) 배열하기</span></div>
                <i class="fas fa-chevron-right text-slate-300"></i>
            </button>
            <button onclick="selectMode(4)" class="game-btn bg-white p-5 rounded-2xl flex items-center justify-between">
                <div class="flex items-center gap-4"><span class="text-3xl">🔤</span><span class="text-xl font-black text-slate-700">4. 단어 배열하기</span></div>
                <i class="fas fa-chevron-right text-slate-300"></i>
            </button>
            <button onclick="selectMode(5)" class="game-btn bg-white p-5 rounded-2xl flex items-center justify-between">
                <div class="flex items-center gap-4"><span class="text-3xl">✍️</span><span class="text-xl font-black text-slate-700">5. 영작하기</span></div>
                <i class="fas fa-chevron-right text-slate-300"></i>
            </button>
        </div>
    </div>

    <!-- 4. 실제 학습 페이지 -->
    <div id="page-learn" class="hidden w-full max-w-3xl flex-col items-center">
        <!-- 상단 헤더 -->
        <div class="w-full flex items-center justify-between mb-4">
            <button onclick="showPage('page-mode')" class="game-btn bg-rose-500 text-white px-4 py-2 rounded-xl font-black whitespace-nowrap">
                <i class="fas fa-times"></i> 그만하기
            </button>
            <div class="bg-slate-200 h-4 rounded-full flex-1 mx-4 border-2 border-slate-800 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-400 w-0 h-full transition-all duration-300"></div>
            </div>
            <div id="progress-text" class="font-black text-slate-600 whitespace-nowrap">0 / 0</div>
        </div>

        <!-- 질문 박스 -->
        <div class="w-full bg-white game-box p-6 mb-6">
            <div id="question-ko" class="text-xl font-black text-indigo-600 mb-4 text-center break-keep"></div>
            <div id="question-en-hint" class="text-lg font-bold text-slate-500 text-center select-none bg-slate-50 p-3 rounded-xl mb-4 hidden"></div>
            
            <!-- 인터랙티브 영역 (모드에 따라 변경됨) -->
            <div id="interactive-area" class="w-full min-h-[150px] flex flex-col items-center justify-center">
                <!-- JS가 내용 채움 -->
            </div>

            <!-- 피드백 메시지 & 힌트 영역 -->
            <div id="hint-area" class="w-full mt-4"></div>
            <div id="feedback-message" class="hidden text-center mt-4"></div>

            <!-- 하단 버튼들 -->
            <div class="flex gap-3 mt-6 w-full">
                <button id="btn-hint" onclick="showHint()" class="hidden game-btn flex-1 bg-amber-400 hover:bg-amber-500 text-amber-900 font-black text-lg py-4 rounded-xl">
                    <i class="fas fa-lightbulb"></i> 힌트 보기
                </button>
                <button id="btn-check" onclick="checkAnswer()" class="game-btn flex-[2] bg-indigo-500 hover:bg-indigo-600 text-white font-black text-xl py-4 rounded-xl">
                    정답 확인 <i class="fas fa-check"></i>
                </button>
                <button id="btn-next" onclick="nextQuestion()" class="hidden game-btn w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl py-4 rounded-xl">
                    다음으로 <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 5. 상점 페이지 -->
    <div id="page-shop" class="hidden w-full max-w-3xl flex-col items-center">
        <div class="w-full flex items-center justify-between mb-6 bg-white p-3 rounded-2xl game-box">
            <button onclick="showPage('page-unit')" class="game-btn bg-slate-200 px-4 py-2 rounded-xl font-bold whitespace-nowrap"><i class="fas fa-arrow-left"></i> 나가기</button>
            <h2 class="text-2xl font-black text-center text-slate-800 whitespace-nowrap mx-2">아바타 상점 🛒</h2>
            <div class="bg-amber-100 text-amber-900 px-3 py-2 rounded-xl font-black border-4 border-amber-300 whitespace-nowrap">
                <i class="fas fa-coins"></i> <span id="shop-coin-display">0</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 w-full">
            <!-- 내 아바타 미리보기 -->
            <div class="md:col-span-2 bg-white p-6 rounded-3xl game-box flex flex-col items-center justify-center relative">
                <h3 class="font-black text-xl mb-6 text-slate-500">캐릭터 꾸미기</h3>
                <div id="preview-avatar" class="slime scale-[2] mb-12 mt-8">
                    <div class="item-slot" id="preview-item"></div>
                </div>
                
                <!-- 위치/크기 조절 컨트롤 -->
                <div id="position-controls" class="w-full bg-indigo-50 p-3 rounded-xl border-2 border-indigo-200 mt-2 mb-4 hidden">
                    <div class="text-sm font-bold text-indigo-700 mb-2 text-center"><i class="fas fa-arrows-alt"></i> 장식 위치/크기 조절</div>
                    <div class="grid grid-cols-4 gap-2 text-center">
                        <button onclick="moveItem('x', -5)" class="game-btn bg-white rounded-lg p-2 text-slate-700"><i class="fas fa-arrow-left"></i></button>
                        <button onclick="moveItem('y', -5)" class="game-btn bg-white rounded-lg p-2 text-slate-700"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="moveItem('y', 5)" class="game-btn bg-white rounded-lg p-2 text-slate-700"><i class="fas fa-arrow-down"></i></button>
                        <button onclick="moveItem('x', 5)" class="game-btn bg-white rounded-lg p-2 text-slate-700"><i class="fas fa-arrow-right"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <button onclick="moveItem('s', -0.1)" class="game-btn bg-white rounded-lg p-2 text-slate-700 text-sm font-bold"><i class="fas fa-search-minus"></i> 작게</button>
                        <button onclick="moveItem('s', 0.1)" class="game-btn bg-white rounded-lg p-2 text-slate-700 text-sm font-bold"><i class="fas fa-search-plus"></i> 크게</button>
                    </div>
                </div>

                <button id="btn-buy-equip" class="game-btn w-full bg-slate-200 text-slate-500 font-black py-4 rounded-xl cursor-not-allowed">
                    아이템을 선택하세요
                </button>
            </div>

            <!-- 상점 탭 및 목록 -->
            <div class="md:col-span-3 bg-white p-4 rounded-3xl game-box flex flex-col h-[600px]">
                <!-- 탭 버튼들 -->
                <div class="flex overflow-x-auto gap-2 mb-4 pb-2 scrollbar-hide" style="scrollbar-width: none;">
                    <button id="tab-colors" onclick="changeShopTab('colors')" class="shop-tab-btn active-tab bg-indigo-500 text-white px-4 py-2 rounded-xl font-black whitespace-nowrap border-b-4 border-indigo-700">색상</button>
                    <button id="tab-hats" onclick="changeShopTab('hats')" class="shop-tab-btn bg-slate-100 text-slate-500 hover:bg-slate-200 px-4 py-2 rounded-xl font-black whitespace-nowrap border-b-4 border-slate-300">머리</button>
                    <button id="tab-faces" onclick="changeShopTab('faces')" class="shop-tab-btn bg-slate-100 text-slate-500 hover:bg-slate-200 px-4 py-2 rounded-xl font-black whitespace-nowrap border-b-4 border-slate-300">얼굴</button>
                    <button id="tab-accs" onclick="changeShopTab('accs')" class="shop-tab-btn bg-slate-100 text-slate-500 hover:bg-slate-200 px-4 py-2 rounded-xl font-black whitespace-nowrap border-b-4 border-slate-300">장식</button>
                </div>
                
                <!-- 아이템 리스트 -->
                <div id="shop-content" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto pr-2 pb-4 flex-1">
                    <!-- JS로 렌더링됨 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------------- [선생님을 위한 안내] ----------------
        // 1. 구글 앱스 스크립트 '웹 앱 URL'을 아래 따옴표 안에 넣어주세요!
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxLhH__yibJqs7QxehYF83xBcT_UTIQNBl5dOEnZRcjSqqcNcE59fnvhBPh-WizWEdT/exec";

        // 2. 5~8단원 본문 데이터 (전체 문장 및 구 분리 완벽 적용)
        const db = {
            5: [
                { en: "Welcome to my blog, “Happy Yujin!”", ko: "제 블로그인 ‘행복한 유진!’에 오신 것을 환영합니다.", phrases: ["Welcome to", "my blog,", "“Happy Yujin!”"] },
                { en: "Hi, my name is Yujin, and I’m writing a blog to introduce my hometown, Chuncheon.", ko: "안녕하세요, 제 이름은 유진이고, 저는 제 고향인 춘천을 소개하기 위해서 블로그를 쓰고 있어요.", phrases: ["Hi, my name is Yujin,", "and I’m writing a blog", "to introduce my hometown, Chuncheon."] },
                { en: "Have you ever visited Chuncheon?", ko: "당신은 춘천을 방문해 본 적이 있나요?", phrases: ["Have you ever", "visited", "Chuncheon?"] },

                { en: "There are so many things to do and so many things to see.", ko: "할 것이 정말 많고, 볼 것도 정말 많답니다.", phrases: ["There are", "so many things to do", "and so many things to see."] },
                { en: "Nowadays, the number of foreign tourists who visit Chuncheon is growing.", ko: "요즘에는 춘천을 방문하는 외국인 관광객들의 수가 늘고 있어요.", phrases: ["Nowadays,", "the number of foreign tourists", "who visit Chuncheon", "is growing."] },
                { en: "I want to share the history of Chuncheon and tips for visitors from around the world.", ko: "저는 춘천의 역사와 전 세계 방문객들을 위한 조언을 공유하고 싶어요.", phrases: ["I want to share", "the history of Chuncheon", "and tips for visitors", "from around the world."] },
                { en: "So, I started this blog.", ko: "그래서 저는 이 블로그를 시작했답니다.", phrases: ["So,", "I started", "this blog."] },
                { en: "Best Places to Visit in Chuncheon", ko: "춘천에서 방문할 만한 최고의 장소들", phrases: ["Best Places", "to Visit", "in Chuncheon"] },
                { en: "Gimyujeong Rail Bike, Soyanggang Skywalk, Memorial Hall for Ethiopian Soldiers in the Korean War, Dakgalbi Restaurants", ko: "김유정 레일 바이크 / 소양강 스카이워크 / 에티오피아 한국전 참전 기념관 / 닭갈비 식당", phrases: ["Gimyujeong Rail Bike,", "Soyanggang Skywalk,", "Memorial Hall", "for Ethiopian Soldiers", "in the Korean War,", "Dakgalbi Restaurants"] },
                { en: "Today’s focus is the Memorial Hall for Ethiopian Soldiers in the Korean War.", ko: "오늘 중점적으로 소개할 곳은 에티오피아군의 한국전 참전 기념관이에요.", phrases: ["Today’s focus is", "the Memorial Hall", "for Ethiopian Soldiers", "in the Korean War."] },
                { en: "On the first floor of the hall, visitors can see the names and pictures of the brave soldiers.", ko: "기념관 1층에서 방문객들은 용감한 군인들의 이름과 사진을 볼 수 있어요.", phrases: ["On the first floor", "of the hall,", "visitors can see", "the names and pictures", "of the brave soldiers."] },
                { en: "On the second floor, Ethiopian cultural items are displayed.", ko: "2층에는 에티오피아의 문화 유물들이 전시되어 있어요.", phrases: ["On the second floor,", "Ethiopian cultural items", "are displayed."] },
                { en: "If you want to know about the special history between Korea and Ethiopia, please click on the link below.", ko: "한국과 에티오피아 사이의 특별한 역사에 대해 알고 싶으면, 아래 링크를 클릭해 주세요.", phrases: ["If you want to know", "about the special history", "between Korea and Ethiopia,", "please click", "on the link below."] },
                { en: "Chuncheon News: Friendship Across the World", ko: "춘천 뉴스: 국경을 뛰어넘은 우정", phrases: ["Chuncheon News:", "Friendship", "Across the World"] },
                { en: "Ethiopia and Korea are far apart on the map, but they have had strong ties for many years.", ko: "에티오피아와 한국은 지도상으로는 멀리 떨어져 있지만, 오랜 세월 동안 강한 유대 관계를 맺어 왔다.", phrases: ["Ethiopia and Korea", "are far apart", "on the map,", "but they have had", "strong ties", "for many years."] },
                { en: "Ethiopia was the only African country to send soldiers during the Korean War.", ko: "에티오피아는 한국 전쟁 중 군인들을 보낸 유일한 아프리카 국가였다.", phrases: ["Ethiopia was", "the only African country", "to send soldiers", "during the Korean War."] },
                { en: "Ethiopian soldiers fought many battles in Chuncheon and never lost.", ko: "에티오피아 군인들은 춘천에서 많은 전투를 치렀고 결코 진 적이 없었다.", phrases: ["Ethiopian soldiers", "fought many battles", "in Chuncheon", "and never lost."] },

                { en: "Ethiopian soldiers used their own money to help them.", ko: "에티오피아 군인들은 그들을 돕기 위해 자신들의 돈을 썼다.", phrases: ["Ethiopian soldiers", "used their own money", "to help them."] },
                { en: "In the 2000s, Chuncheon became the sister city of Addis Ababa, the capital city of Ethiopia.", ko: "2000년대에 춘천은 에티오피아의 수도인 아디스아바바의 자매 도시가 되었다.", phrases: ["In the 2000s,", "Chuncheon became", "the sister city", "of Addis Ababa,", "the capital city of Ethiopia."] },
                { en: "Each city built a memorial hall to honor the Ethiopian soldiers who fought in the Korean War.", ko: "각 도시는 한국 전쟁에서 싸운 에티오피아 군인들을 기리기 위해 기념관을 세웠다.", phrases: ["Each city", "built a memorial hall", "to honor the Ethiopian soldiers", "who fought in the Korean War."] },
                { en: "The Memorial Hall in Chuncheon was built in 2006.", ko: "춘천에 있는 기념관은 2006년에 지어졌다.", phrases: ["The Memorial Hall", "in Chuncheon", "was built", "in 2006."] },
                { en: "It looks like a traditional Ethiopian house. It has three round roofs.", ko: "그것은 에티오피아의 전통 가옥처럼 생겼다. 세 개의 둥근 지붕이 있다.", phrases: ["It looks like", "a traditional Ethiopian house.", "It has", "three round roofs."] },
                { en: "Here, you can feel the strong friendship between the two countries.", ko: "이곳에서 여러분은 두 나라 사이의 굳건한 우정을 느낄 수 있다.", phrases: ["Here,", "you can feel", "the strong friendship", "between the two countries."] },
                { en: "In the next story, I will introduce Soyanggang Skywalk and share some useful tips for traveling there.", ko: "다음 이야기에서는, 소양강 스카이워크를 소개하고 그곳을 여행하는 데 유용한 정보를 공유할게요.", phrases: ["In the next story,", "I will introduce", "Soyanggang Skywalk", "and share", "some useful tips", "for traveling there."] },

            6: [
                { en: "When did you last try something new?", ko: "너는 언제 마지막으로 새로운 것을 시도했니?", phrases: ["When did you", "last try", "something new?"] },
                { en: "I have always wanted to learn skateboarding.", ko: "나는 항상 스케이트보드 타기를 배우고 싶어 했어.", phrases: ["I have always", "wanted to learn", "skateboarding."] },
                { en: "Today, I took the first step toward becoming a cool skater boy.", ko: "오늘, 나는 멋진 스케이터 소년 되기를 향하여 첫걸음을 내디뎠어.", phrases: ["Today,", "I took the first step", "toward becoming", "a cool skater boy."] },
                { en: "I joined a one-day skateboarding class.", ko: "일일 스케이트보드 타기 수업에 참여했거든.", phrases: ["I joined", "a one-day", "skateboarding class."] },
                { en: "When I got to the skatepark, I saw a guy skateboarding in a big bowl.", ko: "스케이트파크에 도착했을 때, 나는 한 남자가 큰 볼(깊고 둥근 형태의 구조물)에서 스케이트보드를 타고 있는 것을 보았어.", phrases: ["When I got to", "the skatepark,", "I saw a guy", "skateboarding", "in a big bowl."] },
                { en: "He was Eric, my skateboarding teacher.", ko: "그는 나의 스케이트보드 타기 선생님인 Eric이었어.", phrases: ["He was Eric,", "my skateboarding teacher."] },
                { en: "He jumped into the air and flipped the board. He landed cleanly.", ko: "그는 공중으로 뛰어올라 보드를 휙 뒤집었어. 그는 깔끔하게 착지했지.", phrases: ["He jumped", "into the air", "and flipped the board.", "He landed cleanly."] },
                { en: "He reminded me of a surfer on a big wave.", ko: "그는 큰 파도를 타는 서퍼를 떠올리게 했어.", phrases: ["He reminded me", "of a surfer", "on a big wave."] },
                { en: "I learned from a blog that skateboarding began with surfers in California.", ko: "나는 한 블로그에서 스케이트보드 타기가 캘리포니아의 서퍼들로부터 시작되었다는 것을 알게 되었어.", phrases: ["I learned", "from a blog", "that skateboarding began", "with surfers", "in California."] },
                { en: "They wanted to surf on land, too, so they put wheels on wooden boards.", ko: "그들은 땅에서도 서핑을 하고 싶어서 나무판자에 바퀴를 달았어.", phrases: ["They wanted to surf", "on land, too,", "so they put wheels", "on wooden boards."] },
                { en: "When there was little rain in California, skateboarders used empty swimming pools as their skateparks.", ko: "캘리포니아에 비가 거의 오지 않았을 때, 스케이트보드 타는 사람들은 빈 수영장을 그들의 스케이트파크로 이용했어.", phrases: ["When there was", "little rain", "in California,", "skateboarders used", "empty swimming pools", "as their skateparks."] },
                { en: "Before the lesson, Eric and I did a warm-up exercise.", ko: "수업 전에, Eric과 나는 준비 운동을 했어.", phrases: ["Before the lesson,", "Eric and I", "did a warm-up exercise."] },
                { en: "Eric told me, “Safety is the most important thing, Ian!”", ko: "Eric은 나에게 “안전이 가장 중요한 거야, Ian!”이라고 말했어.", phrases: ["Eric told me,", "“Safety is", "the most important thing,", "Ian!”"] },
                { en: "Then, he made me wear a helmet and pads to stay safe during the class.", ko: "그런 다음 그는 수업 중에 안전하게 있기 위해 나에게 헬멧과 보호대를 착용하게 했어.", phrases: ["Then,", "he made me wear", "a helmet and pads", "to stay safe", "during the class."] },
                { en: "The lesson finally began. Eric taught me the most basic skill, the “push-off.”", ko: "수업이 마침내 시작되었어. Eric은 나에게 가장 기초적인 기술인 ‘푸시 오프’를 가르쳐 주었어.", phrases: ["The lesson", "finally began.", "Eric taught me", "the most basic skill,", "the “push-off.”"] },
                { en: "To push off on the skateboard, I put one foot on the board and pushed against the ground with the other foot.", ko: "스케이트보드 위에서 푸시 오프를 하기 위해서, 나는 한 발을 보드에 올리고 다른 발로 땅을 밀었어.", phrases: ["To push off", "on the skateboard,", "I put one foot", "on the board", "and pushed against the ground", "with the other foot."] },
                { en: "Tada! I moved forward! This skill looked simple, but I fell down many times.", ko: "짜잔! 나는 앞으로 나아갔어! 이 기술은 간단해 보였지만, 나는 여러 번 넘어졌어.", phrases: ["Tada!", "I moved forward!", "This skill", "looked simple,", "but I fell down", "many times."] },
                { en: "With practice, I was able to keep my balance and ride. I heard Eric cheering for me.", ko: "연습을 통해 나는 균형을 잡고 탈 수 있었어. 나는 Eric이 나를 응원하는 소리를 들었어.", phrases: ["With practice,", "I was able to", "keep my balance", "and ride.", "I heard Eric", "cheering for me."] },
                { en: "After the lesson, I realized skateboarding is more than just a cool-looking sport.", ko: "수업 후에, 나는 스케이트보드 타기가 단지 멋져 보이는 스포츠 그 이상이라는 것을 깨달았어.", phrases: ["After the lesson,", "I realized", "skateboarding is", "more than just", "a cool-looking sport."] },
                { en: "It makes me feel free.", ko: "그것은 나에게 자유를 느끼게 해 줘.", phrases: ["It makes me", "feel free."] },
                { en: "I am glad that I started my skateboarding journey today.", ko: "내가 오늘 스케이트보드 타기 여정을 시작해서 기뻐.", phrases: ["I am glad", "that I started", "my skateboarding journey", "today."] },
                { en: "My shoes and jeans got dirty, but I felt great. It shows I practiced really hard.", ko: "내 신발과 청바지는 더러워졌지만, 나는 기분이 아주 좋았어. 그것은 내가 정말 열심히 연습했다는 것을 보여 주는 것이니까.", phrases: ["My shoes and jeans", "got dirty,", "but I felt great.", "It shows", "I practiced", "really hard."] },
                { en: "I hope to skate better and more freely someday.", ko: "나는 언젠가는 더 잘, 그리고 더 자유롭게 스케이트보드를 탈 수 있으면 좋겠어.", phrases: ["I hope to skate", "better", "and more freely", "someday."] },
                { en: "Do you want to try skateboarding, too? Just visit the nearest skatepark!", ko: "너도 스케이트보드 타기를 해 보고 싶니? 일단 가장 가까운 스케이트파크를 방문해 봐!", phrases: ["Do you want to try", "skateboarding, too?", "Just visit", "the nearest skatepark!"] }
            ],
            7: [
                { en: "When it gets cold outside, people put on jackets and gloves.", ko: "바깥 날씨가 추워지면 사람들은 외투를 입고 장갑을 껴요.", phrases: ["When it gets", "cold outside,", "people put on", "jackets and gloves."] },
                { en: "Some people drink hot chocolate. Others stay inside under blankets.", ko: "어떤 사람들은 핫 초콜릿을 마셔요. 또 다른 사람들은 실내에서 담요 아래 있어요.", phrases: ["Some people", "drink hot chocolate.", "Others", "stay inside", "under blankets."] },
                { en: "But how about animals? How do they survive the cold?", ko: "그런데 동물들은 어떨까요? 그들은 어떻게 추위를 견뎌 낼까요?", phrases: ["But how about", "animals?", "How do they", "survive the cold?"] },
                { en: "Let’s find out some of their survival secrets.", ko: "그들의 생존 비결을 몇 가지 알아봅시다.", phrases: ["Let’s find out", "some of", "their survival secrets."] },
                { en: "First, meet polar bears. Did you know that polar bears have clear fur?", ko: "먼저, 북극곰을 만나 보세요. 여러분은 북극곰이 투명한 털을 갖고 있는 것을 알고 있었나요?", phrases: ["First,", "meet polar bears.", "Did you know", "that polar bears", "have clear fur?"] },
                { en: "Their fur only looks white to us because of the sunlight.", ko: "그들의 털은 햇빛 때문에 우리에게 흰색으로 보일 뿐입니다.", phrases: ["Their fur", "only looks white", "to us", "because of the sunlight."] },
                { en: "So, why is clear fur helpful in the cold?", ko: "그렇다면, 왜 투명한 털이 추위에 도움이 될까요?", phrases: ["So,", "why is clear fur", "helpful", "in the cold?"] },
                { en: "It lets more sunlight reach their skin.", ko: "그것은 더 많은 햇빛이 북극곰의 피부에 닿게 해 줍니다.", phrases: ["It lets", "more sunlight", "reach their skin."] },
                { en: "Here comes another interesting fact about polar bears. They have black skin!", ko: "여기에 북극곰에 대한 또 다른 흥미로운 사실이 있어요. 그들은 검은색 피부를 가지고 있어요!", phrases: ["Here comes", "another interesting fact", "about polar bears.", "They have", "black skin!"] },
                { en: "Dark skin helps them take in more heat.", ko: "어두운 피부는 그들이 더 많은 열을 흡수하는 것을 도와줍니다.", phrases: ["Dark skin", "helps them", "take in", "more heat."] },
                { en: "Having clear fur and black skin keeps polar bears warm.", ko: "투명한 털과 검은색 피부를 가지고 있는 것이 북극곰을 따뜻하게 유지해 줍니다.", phrases: ["Having clear fur", "and black skin", "keeps", "polar bears warm."] },
                { en: "Arctic foxes have dark skin and fur, too. They also use their big tails to keep themselves warm.", ko: "북극여우도 어두운 피부, 그리고 털을 가지고 있어요. 그들은 또한 큰 꼬리를 이용하여 자신들을 따뜻하게 유지해요.", phrases: ["Arctic foxes have", "dark skin and fur, too.", "They also use", "their big tails", "to keep themselves warm."] },
                { en: "When they sleep, they wrap their tails around their bodies like blankets!", ko: "잠을 잘 때, 그들은 꼬리를 마치 담요처럼 몸 주위에 두른답니다!", phrases: ["When they sleep,", "they wrap", "their tails", "around their bodies", "like blankets!"] },
                { en: "However, they may lose body heat through their ears in the cold air.", ko: "그런데 그들은 차가운 공기 속에서는 귀를 통해 체온을 잃을 수가 있어요.", phrases: ["However,", "they may lose", "body heat", "through their ears", "in the cold air."] },
                { en: "Unlike other foxes in warm places, arctic foxes have small ears.", ko: "따뜻한 곳에 사는 다른 여우들과 달리, 북극여우들은 작은 귀를 가졌어요.", phrases: ["Unlike other foxes", "in warm places,", "arctic foxes", "have small ears."] },
                { en: "Their ears are so small that they can help the foxes lose less heat.", ko: "그들의 귀는 정말 작아서 여우들이 열을 덜 잃게 도와줍니다.", phrases: ["Their ears", "are so small", "that they can help", "the foxes", "lose less heat."] },
                { en: "Now, what about animals without fur? How do whales live in icy water?", ko: "이제, 털이 없는 동물들은 어떨까요? 고래들은 어떻게 얼음처럼 찬 물속에서 살까요?", phrases: ["Now,", "what about animals", "without fur?", "How do whales live", "in icy water?"] },
                { en: "The winter sea is so cold that you cannot swim there, even for a second.", ko: "겨울 바다는 너무 차가워서 여러분은 거기에서 단 1초도 수영할 수 없답니다.", phrases: ["The winter sea", "is so cold", "that you cannot swim there,", "even for a second."] },
                { en: "However, whales have a special way to stay warm in icy water.", ko: "그러나 고래들은 얼음처럼 찬 물에서 따뜻하게 지내는 특별한 방법이 있어요.", phrases: ["However,", "whales have", "a special way", "to stay warm", "in icy water."] },
                { en: "They have thick fat under their skin. The fat can be more than 40 cm thick.", ko: "그들은 피부 아래에 두꺼운 지방을 가지고 있습니다. 그 지방은 40센티미터보다 더 두꺼울 수 있어요.", phrases: ["They have", "thick fat", "under their skin.", "The fat can be", "more than", "40 cm thick."] },
                { en: "It covers their bodies and keeps them warm.", ko: "그것은 고래들의 몸을 감싸 그들을 따뜻하게 유지해 줍니다.", phrases: ["It covers", "their bodies", "and keeps them warm."] },
                { en: "The fat also gives whales energy when they cannot find food for a long time.", ko: "그 지방은 또한 고래들이 오랫동안 먹이를 찾지 못할 때 에너지를 공급해 줍니다.", phrases: ["The fat also gives", "whales energy", "when they cannot find food", "for a long time."] },
                { en: "Lastly, in Alaska, winters can be too cold for wood frogs.", ko: "마지막으로, 알래스카에서는 겨울이 송장개구리들에게 매우 추울 수 있어요.", phrases: ["Lastly,", "in Alaska,", "winters can be", "too cold", "for wood frogs."] },
                { en: "What do they do to survive the freezing weather? These frogs freeze themselves!", ko: "그들은 얼어붙을 듯이 추운 날씨를 견뎌 내기 위해 무엇을 할까요? 이 개구리들은 스스로를 얼려 버린답니다!", phrases: ["What do they do", "to survive", "the freezing weather?", "These frogs", "freeze themselves!"] },
                { en: "Up to 60 percent of their bodies freeze. They stop breathing, and their heart stops beating.", ko: "그들 몸의 60퍼센트까지 얼어요. 그들은 숨쉬기를 멈추고 심장 박동도 멈춘답니다.", phrases: ["Up to 60 percent", "of their bodies", "freeze.", "They stop breathing,", "and their heart", "stops beating."] },
                { en: "But don’t worry. When spring comes, they come back to life. Nature is so amazing.", ko: "그러나 걱정하지 마세요. 봄이 오면, 그들은 다시 살아납니다. 자연은 정말 경이로워요.", phrases: ["But don’t worry.", "When spring comes,", "they come back", "to life.", "Nature is", "so amazing."] }
            ],
            8: [

        function loadSaveData(id) {
            const saved = localStorage.getItem('eng_master_' + id);
            if(saved) {
                const parsed = JSON.parse(saved);
                coins = parsed.coins || 0;
                myAvatar = parsed.avatar || { color: '#a7f3d0', hat: '', face: '', acc: '' };
                purchasedItems = parsed.purchased || [];
                // 구버전 마이그레이션 방어코드
                if(myAvatar.item !== undefined) { myAvatar.hat = myAvatar.item; delete myAvatar.item; }
                // 위치 오프셋 데이터가 없으면 기본값 세팅
                if(!myAvatar.offsets) {
                    myAvatar.offsets = { hat: {x:20, y:-30, s:1.8}, face: {x:15, y:20, s:1.4}, acc: {x:-35, y:20, s:1.4} };
                }
            } else {
                coins = 0;
                myAvatar = { 
                    color: '#a7f3d0', hat: '', face: '', acc: '',
                    offsets: { hat: {x:20, y:-30, s:1.8}, face: {x:15, y:20, s:1.4}, acc: {x:-35, y:20, s:1.4} }
                };
                purchasedItems = [];
            }
            updateCoinDisplay();
            applyAvatar();
        }

        function saveGameData() {
            if(!studentData.id) return;
            localStorage.setItem('eng_master_' + studentData.id, JSON.stringify({
                coins: coins,
                avatar: myAvatar,

            }));
        }

        function selectMode(mode) {

        function updateProgress() {

        }

        function renderQuestion() {
            updateProgress();
            failedAttempt = false;
            document.getElementById('btn-hint').classList.add('hidden');
            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('question-ko').innerText = q.ko;
            
            const hintEn = document.getElementById('question-en-hint');
            hintEn.innerText = q.en;
            hintEn.classList.remove('hidden');

            const area = document.getElementById('interactive-area');
            const msg = document.getElementById('feedback-message');
            const hintArea = document.getElementById('hint-area');
            area.innerHTML = '';
            msg.className = 'hidden';
            hintArea.innerHTML = '';
            
            document.getElementById('btn-check').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');

            if (currentMode === 1) {
                hintEn.classList.add('text-indigo-600', 'text-2xl', 'font-black');
                document.getElementById('btn-check').classList.add('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-next').innerText = "다음 읽기";
                area.classList.add('hidden'); // 학습하기 1번 모드 공백 제거
            } else {
                area.classList.remove('hidden'); // 다른 모드에서는 영역 다시 표시
                if (currentMode === 2 || currentMode === 5) {
                    if (currentMode === 5) hintEn.classList.add('hidden');
                    
                    // 영작/따라쓰기 모드 입력칸 생성 (이전 코드에서 누락된 부분 복구)
                    area.innerHTML = '<input type="text" id="answer-input" class="w-full border-4 border-slate-800 rounded-xl p-4 font-bold text-lg focus:outline-none focus:border-indigo-500 transition-colors" placeholder="여기에 정답을 입력하세요" autocomplete="off">';
                    
                    const answerInput = document.getElementById('answer-input');
                    // 복사/붙여넣기 방지
                    answerInput.onpaste = function(e) { e.preventDefault(); };
                    answerInput.oncopy = function(e) { e.preventDefault(); };
                    answerInput.focus();
                    
                } else if (currentMode === 3 || currentMode === 4) {
                    hintEn.classList.add('hidden');
                    let words = [];
                    if (currentMode === 3) {
                        words = q.phrases ? [...q.phrases] : q.en.split(' ');
                    } else {
                        words = q.en.split(' ');
                    }
                    
                    let shuffled = shuffleArray([...words]);
                    arrangedBlocks = [];
                    
                    const poolDiv = document.createElement('div');
                    poolDiv.id = 'word-pool';
                    poolDiv.className = 'flex flex-wrap justify-center gap-3 w-full mb-6 p-4 bg-slate-100 rounded-xl border-4 border-slate-200 min-h-[80px]';
                    
                    const answerDiv = document.createElement('div');
                    answerDiv.id = 'answer-board';
                    answerDiv.className = 'flex flex-wrap justify-center gap-3 w-full p-4 bg-indigo-50 rounded-xl border-4 border-indigo-200 min-h-[100px] border-dashed';
                    
                    shuffled.forEach(w => {
                        const btn = document.createElement('button');
                        btn.className = 'word-block bg-white hover:bg-slate-50 text-slate-700 font-bold px-4 py-2 rounded-lg text-lg';
                        btn.innerText = w;
                        btn.onclick = function() {
                            if (btn.parentElement.id === 'word-pool') {
                                answerDiv.appendChild(btn);
                                arrangedBlocks.push(w);
                            } else {
                                poolDiv.appendChild(btn);
                                arrangedBlocks = arrangedBlocks.filter(b => b !== w);
                            }
                        };
                        poolDiv.appendChild(btn);
                    });
                    
                    area.appendChild(poolDiv);
                    area.appendChild(answerDiv);
                }
            }
        }

        function cleanString(str) {
            return str.replace(/[.,!?“”"'‘’]/g, '').toLowerCase().trim();
        }

        function checkAnswer() {
            const q = currentQuestions[currentQuestionIndex];
            let isCorrect = false;

            if (currentMode === 2 || currentMode === 5) {
                const input = document.getElementById('answer-input').value;
                if(cleanString(input) === cleanString(q.en)) isCorrect = true;
            } else if (currentMode === 3) {
                const correctArr = q.phrases ? q.phrases.map(cleanString) : q.en.split(' ').map(cleanString);
                if(arrangedBlocks.map(cleanString).join('') === correctArr.join('')) isCorrect = true;
            } else if (currentMode === 4) {
                const correctArr = q.en.split(' ').map(cleanString);
                if(arrangedBlocks.map(cleanString).join('') === correctArr.join('')) isCorrect = true;
            }

            if (isCorrect) {
                showMessage(true, "정답입니다! 👏");
                addCoins(10); // 정답 맞힐 때 10코인 추가
                document.getElementById('btn-check').classList.add('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-next').innerText = "다음으로 ➡";
                document.getElementById('btn-hint').classList.add('hidden');
                document.getElementById('hint-area').innerHTML = ''; // 정답 시 힌트 삭제
            } else {
                showMessage(false, "다시 한번 확인해 보세요! 🤔");
                failedAttempt = true;
                document.getElementById('btn-hint').classList.remove('hidden');
            }
        }

        function showHint() {
            const q = currentQuestions[currentQuestionIndex];
            const area = document.getElementById('hint-area');
            area.innerHTML = ''; // 초기화

            const hintBox = document.createElement('div');
            hintBox.className = 'bg-rose-50 border-4 border-rose-200 p-4 rounded-xl font-bold select-none text-left';
            
            const correctWords = (currentMode === 3 && q.phrases ? q.phrases : q.en.split(' ')).map(w => w.trim());
            let inputWords = [];
            let rawInput = '';
            
            if (currentMode === 2 || currentMode === 5) {
                rawInput = document.getElementById('answer-input').value.trim();
                inputWords = rawInput ? rawInput.split(/\s+/) : [];
            } else if (currentMode === 3 || currentMode === 4) {
                inputWords = arrangedBlocks;
            }

            let hintHTML = '<div class="text-sm text-rose-700 mb-2"><i class="fas fa-search"></i> 내가 쓴 답에서 틀린 부분 확인:</div>';
            
            if (inputWords.length === 0) {
                hintHTML += '<div class="text-slate-500 italic mb-4">입력한 내용이 없습니다. 먼저 답을 입력해보세요!</div>';
            } else {
                hintHTML += '<div class="leading-loose text-lg mb-4">';
                let buffer = [];
                let currentIsCorrect = null;

                function flushBuffer() {
                    if (buffer.length === 0) return '';
                    const text = buffer.join(' ');
                    buffer = [];
                    if (currentIsCorrect) {
                        return `<span class="text-slate-500 mx-1">${text}</span>`;
                    } else {
                        return `<span class="error-group">${text}</span>`;
                    }
                }

                // 학생이 입력한 단어(inputWords)를 기준으로 렌더링 (정답 노출 방지)
                inputWords.forEach((iw, idx) => {
                    const isCorrect = (idx < correctWords.length && cleanString(iw) === cleanString(correctWords[idx]));
                    
                    if (currentIsCorrect !== isCorrect) {
                        hintHTML += flushBuffer();
                        currentIsCorrect = isCorrect;
                    }
                    buffer.push(iw); // 학생이 쓴 단어를 화면에 표시
                });
                
                hintHTML += flushBuffer();
                hintHTML += '</div>';
            }

            // 영작 모드(5)인 경우, 정답을 다 알려주지 않고 '첫 글자 마스킹 힌트'를 제공
            if (currentMode === 5) {
                hintHTML += '<div class="text-sm text-indigo-700 mb-2 mt-4 border-t-2 border-rose-200 pt-4"><i class="fas fa-lightbulb"></i> 영작 힌트 (첫 글자와 기호만 보여요!):</div>';
                
                const maskedSentence = q.en.split(' ').map(word => {
                    let result = '';
                    let firstCharFound = false;
                    for (let i=0; i<word.length; i++) {
                        let char = word[i];
                        if (/[a-zA-Z0-9]/.test(char)) {
                            if (!firstCharFound) {
                                result += char;
                                firstCharFound = true;
                            } else {
                                result += '_';
                            }
                        } else {
                            result += char; // 기호는 그대로 유지
                        }
                    }
                    return result;
                }).join(' ');
                
                hintHTML += `<div class="text-lg font-mono tracking-widest bg-white p-3 rounded-xl border-2 border-indigo-200 text-indigo-800 break-words">${maskedSentence}</div>`;
            }

            hintBox.innerHTML = hintHTML;
            area.appendChild(hintBox);
            document.getElementById('btn-hint').classList.add('hidden');
        }

        function showMessage(isSuccess, text) {
            const msg = document.getElementById('feedback-message');
            msg.className = `font-black text-xl p-4 rounded-xl game-box mt-4 ${isSuccess ? 'bg-emerald-100 text-emerald-700 border-emerald-400' : 'bg-rose-100 text-rose-700 border-rose-400'} block`;
            msg.innerHTML = isSuccess ? `🎉 ${text}` : `❌ ${text}`;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentQuestions.length) {
                finishMode();
            } else {
                renderQuestion();
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function addCoins(amount) {
            coins += amount;
            updateCoinDisplay();
            saveGameData();
            
            // 코인 팝업 애니메이션 효과
            const popup = document.createElement('div');
            popup.className = 'coin-popup';
            popup.innerHTML = `+${amount} <i class="fas fa-coins text-amber-400"></i>`;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1200);
        }

            const msg = document.getElementById('feedback-message');
            document.getElementById('btn-check').classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('btn-hint').classList.add('hidden');
            document.getElementById('hint-area').innerHTML = '';
            
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('progress-text').innerText = `${currentQuestions.length} / ${currentQuestions.length}`;
            
            area.innerHTML = `<div class="text-center py-8 flex flex-col items-center">

        function sendToGoogleSheets(action) {
            if(!GAS_URL || GAS_URL.includes("여기에_선생님의")) return;
            const data = {
                studentId: studentData.id,
                studentName: studentData.name,
                unit: currentUnit,
                mode: currentMode,
                action: action
            };
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            }).catch(e => console.log("Google Sheets Error:", e));
        }

            { id: 'f3', name: '선글라스 🕶️', icon: '🕶️', price: 30 },
            { id: 'f4', name: '안경 👓', icon: '👓', price: 40 },
            { id: 'f5', name: '하트눈 😍', icon: '😍', price: 50 },
            { id: 'f6', name: '별눈 🤩', icon: '🤩', price: 100 },
            { id: 'f7', name: '광대 🤡', icon: '🤡', price: 100 },
        ];

        const shopAccs = [
            { id: 'a0', name: '치우기', icon: '', price: 0 },
            { id: 'a1', name: '반짝 ✨', icon: '✨', price: 10 },
            { id: 'a2', name: '음표 🎵', icon: '🎵', price: 20 },
            { id: 'a3', name: '물방울 💧', icon: '💧', price: 30 },
            { id: 'a4', name: '불꽃 🔥', icon: '🔥', price: 50 },
            { id: 'a5', name: '방패 🛡️', icon: '🛡️', price: 100 },
            { id: 'a6', name: '거북이 🐢', icon: '🐢', price: 200 },
            { id: 'a7', name: '요정 🧚', icon: '🧚', price: 300 },
        ];

        function changeShopTab(tab) {
            currentShopTab = tab;
            selectedShopItem = null; // 탭 변경 시 선택 초기화
            // 탭 스타일 리셋
            document.querySelectorAll('.shop-tab-btn').forEach(btn => {
                btn.className = 'shop-tab-btn bg-slate-100 text-slate-500 hover:bg-slate-200 px-4 py-2 rounded-xl font-black whitespace-nowrap border-b-4 border-slate-300';
            });
            // 활성 탭 스타일
            document.getElementById('tab-' + tab).className = 'shop-tab-btn active-tab bg-indigo-500 text-white px-4 py-2 rounded-xl font-black whitespace-nowrap border-b-4 border-indigo-700';
            renderShop();
            updateBuyButton();
        }

        function renderShop() {
            const container = document.getElementById('shop-content');
            container.innerHTML = '';
            
            let list = [];
            let activeKey = '';

            if (currentShopTab === 'colors') { list = shopColors; activeKey = 'color'; }
            else if (currentShopTab === 'hats') { list = shopHats; activeKey = 'hat'; }
            else if (currentShopTab === 'faces') { list = shopFaces; activeKey = 'face'; }
            else if (currentShopTab === 'accs') { list = shopAccs; activeKey = 'acc'; }

            list.forEach(item => {
                const itemValue = item.color || item.icon;
                const isEquipped = myAvatar[activeKey] === itemValue;
                const isPreviewing = previewAvatar[activeKey] === itemValue;
                const isOwned = item.price === 0 || purchasedItems.includes(item.id);
                
                const btn = document.createElement('button');
                // 미리보기 중인 아이템 강조
                btn.className = `game-btn rounded-xl p-3 flex flex-col items-center justify-center font-bold text-sm transition-colors ${isPreviewing ? 'bg-indigo-100 border-indigo-500 text-indigo-900' : 'bg-white hover:bg-slate-50 text-slate-700'}`;
                
                let iconHTML = item.color 
                    ? `<div class="w-10 h-10 rounded-full mb-2 border-4 ${isPreviewing ? 'border-white' : 'border-slate-800'}" style="background-color: ${item.color}"></div>`
                    : `<div class="text-4xl mb-2">${item.icon || '❌'}</div>`;
                
                let priceHTML = '';
                if (isEquipped) {
                    priceHTML = `<div class="text-emerald-600 font-black mt-1">착용중 ✔️</div>`;
                } else if (isOwned) {
                    priceHTML = `<div class="text-indigo-500 font-black mt-1">보유중</div>`;
                } else {
                    priceHTML = `<div class="text-amber-500 font-black mt-1">${item.price} 코인</div>`;
                }

                btn.innerHTML = `${iconHTML}
                                 <div class="truncate text-base mb-1 w-full text-center">${item.name}</div>
                                 ${priceHTML}`;
                                 
                btn.onclick = () => selectShopItem(item, activeKey, itemValue);
                container.appendChild(btn);
            });
        }

        // 아이템 선택 시 미리보기에만 적용 (실제 구매/장착은 버튼 클릭 시)
        function selectShopItem(item, key, value) {
            previewAvatar[key] = value;
            selectedShopItem = { item, key, value };
            applyPreviewAvatar();
            renderShop(); // UI 리렌더링하여 선택 테두리 갱신
            updateBuyButton();
        }

        // 장식품 위치/크기 조절 함수
        function moveItem(axis, amount) {
            if (!selectedShopItem || selectedShopItem.key === 'color') return;
            const key = selectedShopItem.key; // 'hat', 'face', 'acc'
            
            if (axis === 'x') previewAvatar.offsets[key].x += amount;
            if (axis === 'y') previewAvatar.offsets[key].y += amount;
            if (axis === 's') {
                previewAvatar.offsets[key].s = Math.max(0.5, previewAvatar.offsets[key].s + amount);
            }
            
            applyPreviewAvatar();
            updateBuyButton(); // 변경사항이 생겼으므로 저장 버튼 갱신
        }

        // 구매/장착 버튼 상태 업데이트
        function updateBuyButton() {
            const btn = document.getElementById('btn-buy-equip');
            const posCtrl = document.getElementById('position-controls');

            let activeKey = '';
            if (currentShopTab === 'colors') activeKey = 'color';
            else if (currentShopTab === 'hats') activeKey = 'hat';
            else if (currentShopTab === 'faces') activeKey = 'face';
            else if (currentShopTab === 'accs') activeKey = 'acc';

            // 컬러탭이 아니고, 해당 카테고리에 아이템이 선택/장착되어 있으면 컨트롤 표시
            if (activeKey !== 'color' && previewAvatar[activeKey] !== '') {
                posCtrl.classList.remove('hidden');
            } else {
                posCtrl.classList.add('hidden');
            }

            // 기존 상태와 미리보기 상태 비교 (변경사항 여부 체크)
            const isChanged = JSON.stringify(previewAvatar) !== JSON.stringify(myAvatar);

            if (!selectedShopItem) {
                if(isChanged) {
                    btn.innerText = "💾 변경사항 저장하기";
                    btn.className = "game-btn w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-xl mt-4";
                    btn.onclick = savePreviewToAvatar;
                } else {
                    btn.innerText = "아이템을 선택하세요";
                    btn.className = "game-btn w-full bg-slate-200 text-slate-500 font-black py-4 rounded-xl mt-4 cursor-not-allowed";
                    btn.onclick = null;
                }
                return;
            }

            const { item, key, value } = selectedShopItem;
            const isOwned = item.price === 0 || purchasedItems.includes(item.id);

            if (!isOwned) {
                btn.innerHTML = `🛒 구매 및 장착 (<i class="fas fa-coins text-amber-300"></i> ${item.price})`;
                if (coins >= item.price) {
                    btn.className = "game-btn w-full bg-indigo-500 hover:bg-indigo-600 text-white font-black py-4 rounded-xl mt-4";
                    btn.onclick = () => {
                        coins -= item.price;
                        purchasedItems.push(item.id);
                        savePreviewToAvatar();
                    };
                } else {
                    btn.className = "game-btn w-full bg-rose-400 text-white font-black py-4 rounded-xl mt-4 opacity-70 cursor-not-allowed";
                    btn.onclick = () => alert("코인이 부족합니다! 문제를 더 풀어서 코인을 모아보세요.");
                }
            } else if (isChanged) {
                btn.innerText = "💾 장착 및 위치 저장";
                btn.className = "game-btn w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-xl mt-4";
                btn.onclick = savePreviewToAvatar;
            } else {
                btn.innerText = "✔️ 현재 착용 중";
                btn.className = "game-btn w-full bg-slate-200 text-slate-500 font-black py-4 rounded-xl mt-4 cursor-not-allowed";
                btn.onclick = null;
            }
        }

        // 미리보기 내용을 실제 내 아바타로 확정 저장
        function savePreviewToAvatar() {
            myAvatar = JSON.parse(JSON.stringify(previewAvatar));
            saveGameData();
            updateCoinDisplay();
            applyAvatar();
            renderShop(); 
            
            const btn = document.getElementById('btn-buy-equip');
            btn.innerText = "저장 완료! ✨";
            btn.className = "game-btn w-full bg-emerald-400 text-emerald-900 font-black py-4 rounded-xl mt-4";
            setTimeout(() => { updateBuyButton(); }, 1500);
        }

        // 아바타 렌더링을 위한 공통 HTML 생성 함수 (위치/크기 적용)
        function getAvatarHTML(avatarObj) {
            const off = avatarObj.offsets;
            const hatHTML = avatarObj.hat ? `<div style="position:absolute; top:${off.hat.y}%; left:${off.hat.x}%; transform: scale(${off.hat.s}); z-index:20; text-shadow: 2px 2px 0px rgba(0,0,0,0.2); pointer-events:none;">${avatarObj.hat}</div>` : '';
            const faceHTML = avatarObj.face ? `<div style="position:absolute; top:${off.face.y}%; left:${off.face.x}%; transform: scale(${off.face.s}); z-index:15; pointer-events:none;">${avatarObj.face}</div>` : '';
            const accHTML = avatarObj.acc ? `<div style="position:absolute; top:${off.acc.y}%; left:${off.acc.x}%; transform: scale(${off.acc.s}); z-index:10; pointer-events:none;">${avatarObj.acc}</div>` : '';
            return hatHTML + faceHTML + accHTML;
        }

        function applyPreviewAvatar() {
            const previewSlime = document.getElementById('preview-avatar');
            if(previewSlime) previewSlime.style.backgroundColor = previewAvatar.color || '#a7f3d0';
            const previewItem = document.getElementById('preview-item');
            if(previewItem) previewItem.innerHTML = getAvatarHTML(previewAvatar);
        }

        function applyAvatar() {
            const slimes = document.querySelectorAll('.slime:not(#preview-avatar)');
            slimes.forEach(s => {
                s.style.backgroundColor = myAvatar.color || '#a7f3d0';
            });
            
            const combinedHTML = getAvatarHTML(myAvatar);
            document.getElementById('mini-item').innerHTML = combinedHTML;
        }
    </script>
</body>
</html>
