<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 본문 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .block-item {
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        .block-item:active {
            transform: scale(0.95);
        }
        .word-pool {
            min-height: 80px;
        }
        .answer-area {
            min-height: 80px;
            border: 2px dashed #cbd5e1;
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <nav class="bg-indigo-600 text-white shadow-md p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-book-open mr-2"></i>영어 본문 마스터</h1>
            <div id="user-info-display" class="hidden text-sm font-medium bg-indigo-700 px-3 py-1 rounded-full"></div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <!-- 1. 로그인 페이지 -->
        <div id="page-login" class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full w-full">
            <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">학습 시작하기</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">학번</label>
                    <input type="text" id="input-student-id" placeholder="예: 20101" class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">이름</label>
                    <input type="text" id="input-student-name" placeholder="예: 김오션" class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                </div>
                <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-200 mt-4">
                    입장하기 <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 2. 단원 선택 페이지 -->
        <div id="page-unit" class="hidden w-full max-w-4xl">
            <h2 class="text-3xl font-bold mb-8 text-center text-slate-800">학습할 단원을 선택하세요</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="selectUnit(5)" class="bg-white hover:bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-6 shadow-sm transition text-left group">
                    <span class="text-indigo-600 font-bold text-lg mb-2 block">Lesson 5</span>
                    <span class="text-slate-700 font-semibold text-xl group-hover:text-indigo-700">나의 고향, 춘천</span>
                </button>
                <button onclick="selectUnit(6)" class="bg-white hover:bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-6 shadow-sm transition text-left group">
                    <span class="text-indigo-600 font-bold text-lg mb-2 block">Lesson 6</span>
                    <span class="text-slate-700 font-semibold text-xl group-hover:text-indigo-700">나의 첫 스케이트보드 타기 수업</span>
                </button>
                <button onclick="selectUnit(7)" class="bg-white hover:bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-6 shadow-sm transition text-left group">
                    <span class="text-indigo-600 font-bold text-lg mb-2 block">Lesson 7</span>
                    <span class="text-slate-700 font-semibold text-xl group-hover:text-indigo-700">추운 곳에 사는 동물들</span>
                </button>
                <button onclick="selectUnit(8)" class="bg-white hover:bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-6 shadow-sm transition text-left group">
                    <span class="text-indigo-600 font-bold text-lg mb-2 block">Lesson 8</span>
                    <span class="text-slate-700 font-semibold text-xl group-hover:text-indigo-700">가격 비교하기</span>
                </button>
            </div>
        </div>

        <!-- 3. 모드 선택 페이지 -->
        <div id="page-mode" class="hidden w-full max-w-4xl">
            <div class="flex items-center mb-8">
                <button onclick="showPage('page-unit')" class="text-slate-500 hover:text-indigo-600 transition p-2 rounded-full hover:bg-slate-100"><i class="fas fa-arrow-left text-xl"></i></button>
                <h2 class="text-3xl font-bold text-center text-slate-800 flex-grow mr-10" id="mode-title-unit">학습 방식 선택</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="startLearning(1)" class="bg-white hover:border-indigo-400 border-2 border-transparent rounded-2xl p-6 shadow-md transition text-left">
                    <div class="bg-blue-100 text-blue-600 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4"><i class="fas fa-align-left"></i></div>
                    <h3 class="text-xl font-bold mb-2">1. 한 줄 해석 학습</h3>
                    <p class="text-slate-500 text-sm">영어 문장과 한국어 해석을 한 줄씩 비교하며 읽어봅니다.</p>
                </button>
                <button onclick="startLearning(2)" class="bg-white hover:border-indigo-400 border-2 border-transparent rounded-2xl p-6 shadow-md transition text-left">
                    <div class="bg-emerald-100 text-emerald-600 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4"><i class="fas fa-keyboard"></i></div>
                    <h3 class="text-xl font-bold mb-2">2. 영어 문장 따라 치기</h3>
                    <p class="text-slate-500 text-sm">주어진 영어 문장을 그대로 타이핑하며 스펠링을 익힙니다.</p>
                </button>
                <button onclick="startLearning(3)" class="bg-white hover:border-indigo-400 border-2 border-transparent rounded-2xl p-6 shadow-md transition text-left">
                    <div class="bg-purple-100 text-purple-600 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4"><i class="fas fa-layer-group"></i></div>
                    <h3 class="text-xl font-bold mb-2">3. 의미 단위(구) 배열</h3>
                    <p class="text-slate-500 text-sm">한국어 뜻을 보고 덩어리(구) 단위로 쪼개진 블록을 배열합니다.</p>
                </button>
                <button onclick="startLearning(4)" class="bg-white hover:border-indigo-400 border-2 border-transparent rounded-2xl p-6 shadow-md transition text-left">
                    <div class="bg-orange-100 text-orange-600 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4"><i class="fas fa-puzzle-piece"></i></div>
                    <h3 class="text-xl font-bold mb-2">4. 단어 배열</h3>
                    <p class="text-slate-500 text-sm">한국어 뜻을 보고 낱개 단어로 쪼개진 블록을 순서대로 배열합니다.</p>
                </button>
                <button onclick="startLearning(5)" class="bg-white hover:border-indigo-400 border-2 border-transparent rounded-2xl p-6 shadow-md transition text-left md:col-span-2">
                    <div class="bg-rose-100 text-rose-600 w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-4"><i class="fas fa-pen-nib"></i></div>
                    <h3 class="text-xl font-bold mb-2">5. 영작하기 (최종 단계)</h3>
                    <p class="text-slate-500 text-sm">한국어 뜻만 보고 영어 문장을 스스로 처음부터 끝까지 적어봅니다.</p>
                </button>
            </div>
        </div>

        <!-- 4. 실제 학습 페이지 -->
        <div id="page-learn" class="hidden w-full max-w-3xl">
            <!-- 진행도 바 -->
            <div class="mb-6 flex items-center gap-4">
                <button onclick="showPage('page-mode')" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
                <div class="w-full bg-slate-200 rounded-full h-3">
                    <div id="progress-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
                <span id="learning-progress" class="text-sm font-bold text-slate-500 whitespace-nowrap">1 / 10</span>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
                <!-- 질문 영역 -->
                <div class="mb-8">
                    <div class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full mb-3" id="badge-mode">모드</div>
                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed break-keep" id="question-ko">한국어 문장</h3>
                </div>

                <!-- 인터랙션 영역 (모드에 따라 동적으로 변경됨) -->
                <div id="interaction-area" class="min-h-[120px]">
                    <!-- JS에서 렌더링 -->
                </div>

                <!-- 정답 확인 피드백 -->
                <div id="feedback-area" class="mt-4 hidden p-4 rounded-xl font-medium text-center"></div>

                <!-- 컨트롤 버튼 -->
                <div class="mt-8 flex justify-end gap-3">
                    <button id="btn-hint" onclick="showHint()" class="hidden bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold py-3 px-6 rounded-xl transition shadow-sm">
                        힌트 보기 <i class="fas fa-lightbulb ml-1"></i>
                    </button>
                    <button id="btn-check" onclick="checkAnswer()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl transition">
                        정답 확인 <i class="fas fa-check ml-1"></i>
                    </button>
                    <button id="btn-next" onclick="nextQuestion()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-indigo-200">
                        다음 문장 <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // === [데이터베이스 - 5,6,7,8과 전체 문장] ===
        const db = {
            5: [
                { en: "Welcome to my blog, “Happy Yujin!”", ko: "제 블로그인 ‘행복한 유진!’에 오신 것을 환영합니다.", phrases: ["Welcome to", "my blog,", "“Happy Yujin!”"] },
                { en: "Hi, my name is Yujin,", ko: "안녕하세요, 제 이름은 유진이고,", phrases: ["Hi,", "my name is", "Yujin,"] },
                { en: "and I’m writing a blog to introduce my hometown, Chuncheon.", ko: "저는 제 고향인 춘천을 소개하기 위해서 블로그를 쓰고 있어요.", phrases: ["and I’m writing", "a blog", "to introduce", "my hometown, Chuncheon."] },
                { en: "Have you ever visited Chuncheon?", ko: "당신은 춘천을 방문해 본 적이 있나요?", phrases: ["Have you ever", "visited", "Chuncheon?"] },
                { en: "It’s famous for its beautiful mountains and lakes.", ko: "춘천은 아름다운 산과 호수로 유명해요.", phrases: ["It’s famous for", "its beautiful", "mountains and lakes."] },
                { en: "There are so many things to do and so many things to see.", ko: "할 것이 정말 많고, 볼 것도 정말 많답니다.", phrases: ["There are", "so many things to do", "and so many things to see."] },
                { en: "Nowadays, the number of foreign tourists who visit Chuncheon is growing.", ko: "요즘에는 춘천을 방문하는 외국인 관광객들의 수가 늘고 있어요.", phrases: ["Nowadays,", "the number of", "foreign tourists", "who visit Chuncheon", "is growing."] },
                { en: "I want to share the history of Chuncheon and tips for visitors from around the world.", ko: "저는 춘천의 역사와 전 세계 방문객들을 위한 조언을 공유하고 싶어요.", phrases: ["I want to share", "the history of Chuncheon", "and tips for visitors", "from around the world."] },
                { en: "So, I started this blog.", ko: "그래서 저는 이 블로그를 시작했답니다.", phrases: ["So,", "I started", "this blog."] },
                { en: "Best Places to Visit in Chuncheon", ko: "춘천에서 방문할 만한 최고의 장소들", phrases: ["Best Places", "to Visit", "in Chuncheon"] },
                { en: "Gimyujeong Rail Bike", ko: "김유정 레일 바이크", phrases: ["Gimyujeong Rail Bike"] },
                { en: "Soyanggang Skywalk", ko: "소양강 스카이워크", phrases: ["Soyanggang Skywalk"] },
                { en: "Memorial Hall for Ethiopian Soldiers in the Korean War", ko: "에티오피아 한국전 참전 기념관", phrases: ["Memorial Hall", "for Ethiopian Soldiers", "in the Korean War"] },
                { en: "Dakgalbi Restaurants", ko: "닭갈비 식당", phrases: ["Dakgalbi Restaurants"] },
                { en: "Today’s focus is the Memorial Hall for Ethiopian Soldiers in the Korean War.", ko: "오늘 중점적으로 소개할 곳은 에티오피아군의 한국전 참전 기념관이에요.", phrases: ["Today’s focus is", "the Memorial Hall", "for Ethiopian Soldiers", "in the Korean War."] },
                { en: "On the first floor of the hall, visitors can see the names and pictures of the brave soldiers.", ko: "기념관 1층에서 방문객들은 용감한 군인들의 이름과 사진을 볼 수 있어요.", phrases: ["On the first floor", "of the hall,", "visitors can see", "the names and pictures", "of the brave soldiers."] },
                { en: "On the second floor, Ethiopian cultural items are displayed.", ko: "2층에는 에티오피아의 문화 유물들이 전시되어 있어요.", phrases: ["On the second floor,", "Ethiopian cultural items", "are displayed."] },
                { en: "If you want to know about the special history between Korea and Ethiopia, please click on the link below.", ko: "한국과 에티오피아 사이의 특별한 역사에 대해 알고 싶으면, 아래 링크를 클릭해 주세요.", phrases: ["If you want to know", "about the special history", "between Korea and Ethiopia,", "please click", "on the link below."] },
                { en: "Friendship Across the World", ko: "국경을 뛰어넘은 우정", phrases: ["Friendship", "Across the World"] },
                { en: "Ethiopia and Korea are far apart on the map,", ko: "에티오피아와 한국은 지도상으로는 멀리 떨어져 있지만,", phrases: ["Ethiopia and Korea", "are far apart", "on the map,"] },
                { en: "but they have had strong ties for many years.", ko: "오랜 세월 동안 강한 유대 관계를 맺어 왔다.", phrases: ["but they have had", "strong ties", "for many years."] },
                { en: "Ethiopia was the only African country to send soldiers during the Korean War.", ko: "에티오피아는 한국 전쟁 중 군인들을 보낸 유일한 아프리카 국가였다.", phrases: ["Ethiopia was", "the only African country", "to send soldiers", "during the Korean War."] },
                { en: "Ethiopian soldiers fought many battles in Chuncheon and never lost.", ko: "에티오피아 군인들은 춘천에서 많은 전투를 치렀고 결코 진 적이 없었다.", phrases: ["Ethiopian soldiers", "fought many battles", "in Chuncheon", "and never lost."] },
                { en: "During the war, some Korean children lost their parents.", ko: "전쟁 중, 일부 한국 어린이들이 부모를 잃었다.", phrases: ["During the war,", "some Korean children", "lost their parents."] },
                { en: "Ethiopian soldiers used their own money to help them.", ko: "에티오피아 군인들은 그들을 돕기 위해 자신들의 돈을 썼다.", phrases: ["Ethiopian soldiers", "used their own money", "to help them."] },
                { en: "In the 2000s, Chuncheon became the sister city of Addis Ababa, the capital city of Ethiopia.", ko: "2000년대에 춘천은 에티오피아의 수도인 아디스아바바의 자매 도시가 되었다.", phrases: ["In the 2000s,", "Chuncheon became", "the sister city", "of Addis Ababa,", "the capital city of Ethiopia."] },
                { en: "Each city built a memorial hall to honor the Ethiopian soldiers who fought in the Korean War.", ko: "각 도시는 한국 전쟁에서 싸운 에티오피아 군인들을 기리기 위해 기념관을 세웠다.", phrases: ["Each city built", "a memorial hall", "to honor the Ethiopian soldiers", "who fought in the Korean War."] },
                { en: "The Memorial Hall in Chuncheon was built in 2006.", ko: "춘천에 있는 기념관은 2006년에 지어졌다.", phrases: ["The Memorial Hall", "in Chuncheon", "was built in 2006."] },
                { en: "It looks like a traditional Ethiopian house.", ko: "그것은 에티오피아의 전통 가옥처럼 생겼다.", phrases: ["It looks like", "a traditional", "Ethiopian house."] },
                { en: "It has three round roofs.", ko: "세 개의 둥근 지붕이 있다.", phrases: ["It has", "three round roofs."] },
                { en: "Here, you can feel the strong friendship between the two countries.", ko: "이곳에서 여러분은 두 나라 사이의 굳건한 우정을 느낄 수 있다.", phrases: ["Here,", "you can feel", "the strong friendship", "between the two countries."] },
                { en: "In the next story, I will introduce Soyanggang Skywalk", ko: "다음 이야기에서는, 소양강 스카이워크를 소개하고", phrases: ["In the next story,", "I will introduce", "Soyanggang Skywalk"] },
                { en: "and share some useful tips for traveling there.", ko: "그곳을 여행하는 데 유용한 정보를 공유할게요.", phrases: ["and share", "some useful tips", "for traveling there."] },
                { en: "You don’t want to miss it!", ko: "놓치면 안 돼요!", phrases: ["You don’t want", "to miss it!"] }
            ],
            6: [
                { en: "When did you last try something new?", ko: "너는 언제 마지막으로 새로운 것을 시도했니?", phrases: ["When did you", "last try", "something new?"] },
                { en: "I have always wanted to learn skateboarding.", ko: "나는 항상 스케이트보드 타기를 배우고 싶어 했어.", phrases: ["I have always wanted", "to learn skateboarding."] },
                { en: "Today, I took the first step toward becoming a cool skater boy.", ko: "오늘, 나는 멋진 스케이터 소년 되기를 향하여 첫걸음을 내디뎠어.", phrases: ["Today,", "I took the first step", "toward becoming", "a cool skater boy."] },
                { en: "I joined a one-day skateboarding class.", ko: "일일 스케이트보드 타기 수업에 참여했거든.", phrases: ["I joined", "a one-day", "skateboarding class."] },
                { en: "When I got to the skatepark, I saw a guy skateboarding in a big bowl.", ko: "스케이트파크에 도착했을 때, 나는 한 남자가 큰 볼(깊고 둥근 형태의 구조물)에서 스케이트보드를 타고 있는 것을 보았어.", phrases: ["When I got to", "the skatepark,", "I saw a guy", "skateboarding in a big bowl."] },
                { en: "He was Eric, my skateboarding teacher.", ko: "그는 나의 스케이트보드 타기 선생님인 Eric이었어.", phrases: ["He was Eric,", "my skateboarding teacher."] },
                { en: "He jumped into the air and flipped the board.", ko: "그는 공중으로 뛰어올라 보드를 휙 뒤집었어.", phrases: ["He jumped", "into the air", "and flipped the board."] },
                { en: "He landed cleanly.", ko: "그는 깔끔하게 착지했지.", phrases: ["He landed", "cleanly."] },
                { en: "He reminded me of a surfer on a big wave.", ko: "그는 큰 파도를 타는 서퍼를 떠올리게 했어.", phrases: ["He reminded me", "of a surfer", "on a big wave."] },
                { en: "I learned from a blog that skateboarding began with surfers in California.", ko: "나는 한 블로그에서 스케이트보드 타기가 캘리포니아의 서퍼들로부터 시작되었다는 것을 알게 되었어.", phrases: ["I learned from a blog", "that skateboarding began", "with surfers", "in California."] },

        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            const area = document.getElementById('interaction-area');
            const btnCheck = document.getElementById('btn-check');
            const btnNext = document.getElementById('btn-next');
            const feedback = document.getElementById('feedback-area');

            // 진행 상태 업데이트
            document.getElementById('learning-progress').innerText = `${currentQuestionIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / currentQuestions.length) * 100}%`;

            // 초기화
            area.innerHTML = '';
            feedback.classList.add('hidden');
            feedback.className = 'mt-4 hidden p-4 rounded-xl font-medium text-center';
            document.getElementById('btn-hint').classList.add('hidden');
            
            document.getElementById('question-ko').innerText = q.ko;
            
            btnCheck.classList.remove('hidden');
            btnNext.classList.add('hidden');

            if (currentMode === 1) {
                area.innerHTML = `<div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100"><p class="text-2xl font-semibold text-indigo-900 leading-relaxed break-keep">${q.en}</p></div>`;
                btnCheck.classList.add('hidden');
                btnNext.classList.remove('hidden');
            } 
            else if (currentMode === 2 || currentMode === 5) {
                if (currentMode === 2) {
                    area.innerHTML += `<div class="mb-4 text-slate-500 text-lg font-medium">${q.en}</div>`;
                }
                area.innerHTML += `<textarea id="answer-input" rows="3" class="w-full border-2 border-slate-300 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-lg" placeholder="${currentMode === 2 ? '위 문장을 똑같이 입력하세요.' : '영어로 작문해보세요.'}"></textarea>`;
                setTimeout(() => document.getElementById('answer-input').focus(), 100);
            }
            else if (currentMode === 3 || currentMode === 4) {
                let parts = [];
                if (currentMode === 3 && q.phrases) {
                    parts = [...q.phrases];
                } else {
                    parts = q.en.split(' ');
                }
                
                poolBlocks = shuffle(parts.map((text, id) => ({ id, text })));
                arrangedBlocks = [];
                
                area.innerHTML = `
                    <p class="text-sm text-slate-500 mb-2 font-semibold">완성된 문장 영역 (아래 블록을 클릭하여 위로 올리세요)</p>
                    <div id="answer-box" class="answer-area flex flex-wrap gap-2 p-4 bg-white rounded-xl mb-6 shadow-inner"></div>
                    <p class="text-sm text-slate-500 mb-2 font-semibold">선택할 블록 영역</p>
                    <div id="pool-box" class="word-pool flex flex-wrap gap-2 p-4 bg-slate-100 rounded-xl"></div>
                `;
                renderBlocks();
            }
        }

        function renderBlocks() {
            const poolBox = document.getElementById('pool-box');
            const answerBox = document.getElementById('answer-box');
            poolBox.innerHTML = '';
            answerBox.innerHTML = '';

            poolBlocks.forEach(block => {
                const el = document.createElement('div');
                el.className = 'block-item bg-white border-2 border-slate-300 text-slate-700 px-4 py-2 rounded-lg font-semibold shadow-sm hover:border-indigo-400 hover:text-indigo-600';
                el.innerText = block.text;
                el.onclick = () => moveBlock(block.id, 'pool');
                poolBox.appendChild(el);
            });

            arrangedBlocks.forEach(block => {
                const el = document.createElement('div');
                el.className = 'block-item bg-indigo-600 text-white border-2 border-indigo-700 px-4 py-2 rounded-lg font-semibold shadow-sm hover:bg-indigo-700';
                el.innerText = block.text;
                el.onclick = () => moveBlock(block.id, 'answer');
                answerBox.appendChild(el);
            });
        }

        function moveBlock(id, source) {
            if (source === 'pool') {
                const idx = poolBlocks.findIndex(b => b.id === id);
                arrangedBlocks.push(poolBlocks[idx]);
                poolBlocks.splice(idx, 1);
            } else {
                const idx = arrangedBlocks.findIndex(b => b.id === id);
                poolBlocks.push(arrangedBlocks[idx]);
                arrangedBlocks.splice(idx, 1);
            }
            renderBlocks();
        }

        function checkAnswer() {
            const q = currentQuestions[currentQuestionIndex];
            let studentAnswer = "";

            if (currentMode === 2 || currentMode === 5) {
                studentAnswer = document.getElementById('answer-input').value;
            } else if (currentMode === 3 || currentMode === 4) {
                studentAnswer = arrangedBlocks.map(b => b.text).join(' ');
            }

            const isCorrect = normalizeText(studentAnswer) === normalizeText(q.en);
            const feedback = document.getElementById('feedback-area');
            
            feedback.classList.remove('hidden');
            if (isCorrect) {
                feedback.classList.add('bg-green-100', 'text-green-700');
                feedback.classList.remove('bg-red-100', 'text-red-700');
                feedback.innerHTML = `<i class="fas fa-check-circle mr-2"></i> 정답입니다! 완벽해요.`;
                
                document.getElementById('btn-check').classList.add('hidden');
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-hint').classList.add('hidden');

                // 정답 맞춤을 GAS에 기록 (비동기)
                sendToGoogleSheets('정답', currentUnit, currentMode);
            } else {
                feedback.classList.add('bg-red-100', 'text-red-700');
                feedback.classList.remove('bg-green-100', 'text-green-700');
                
                let helpText = "다시 한번 확인해보세요!";
                if(currentMode === 5) {
                    helpText = `다시 시도해보세요. (힌트: ${q.en.charAt(0)}...로 시작합니다)`;
                }
                feedback.innerHTML = `<i class="fas fa-times-circle mr-2"></i> 아쉽네요. ${helpText}`;
                
                // 오답일 경우 힌트보기 버튼 활성화
                document.getElementById('btn-hint').classList.remove('hidden');
            }
        }

        function showHint() {
            const q = currentQuestions[currentQuestionIndex];
            const feedback = document.getElementById('feedback-area');
            let studentAnswer = "";

            if (currentMode === 2 || currentMode === 5) {
                studentAnswer = document.getElementById('answer-input').value;
            } else if (currentMode === 3 || currentMode === 4) {
                studentAnswer = arrangedBlocks.map(b => b.text).join(' ');
            }

            const normalize = (w) => w.toLowerCase().replace(/[.,?!'“"”]/g, '');
            const studentWords = studentAnswer.trim().split(/\s+/).filter(w => w);
            const correctWords = q.en.trim().split(/\s+/).filter(w => w);

            let hintHTML = '<div class="text-left mt-3 p-4 bg-white rounded-xl border border-red-200 shadow-sm"><p class="text-sm text-slate-500 mb-2"><i class="fas fa-search text-red-400 mr-1"></i>틀린 부분이 밑줄 쳐져 있습니다:</p><div class="text-lg leading-relaxed break-keep">';

            if (studentWords.length === 0) {
                hintHTML += '<span class="text-slate-400">입력된 내용이 없습니다.</span>';
            } else {
                let sIdx = 0;
                let cIdx = 0;

                while (sIdx < studentWords.length) {
                    let sWord = studentWords[sIdx];
                    let normS = normalize(sWord);
                    let normC = cIdx < correctWords.length ? normalize(correctWords[cIdx]) : null;

                    if (normS === normC) {
                        hintHTML += `<span class="text-slate-700">${sWord}</span> `;
                        sIdx++;
                        cIdx++;
                    } else {
                        // 학생이 단어를 빼먹었을 경우를 대비한 앞부분 탐색 (최대 2단어 look-ahead)
                        let matchFound = false;
                        for (let look = 1; look <= 2; look++) {
                            if (cIdx + look < correctWords.length && normS === normalize(correctWords[cIdx + look])) {
                                cIdx += look;
                                matchFound = true;
                                break;
                            }
                        }

                        if (matchFound) {
                            continue; // cIdx를 조정한 후 현재 학생 단어를 다시 비교
                        }

                        // 불일치 시 빨간색 굵은 밑줄 처리
                        hintHTML += `<span class="underline decoration-red-500 decoration-[3px] text-red-600 font-bold">${sWord}</span> `;
                        sIdx++;
                        cIdx++;
                    }
                }
            }
            hintHTML += '</div></div>';

            // 힌트 영역 추가 (중복 방지)
            if (!feedback.innerHTML.includes('틀린 부분이 밑줄 쳐져 있습니다')) {
                feedback.innerHTML += hintHTML;
            }
            
            // 힌트 버튼 다시 숨기기
            document.getElementById('btn-hint').classList.add('hidden');
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                sendToGoogleSheets('완료', currentUnit, currentMode);
                Swal.fire({
                    title: '학습 완료!',
                    text: `Lesson ${currentUnit}의 ${currentMode}번 모드를 마스터했습니다!`,
                    icon: 'success',
                    confirmButtonText: '확인',
                    confirmButtonColor: '#4f46e5'
                }).then(() => {
                    showPage('page-mode');
                });
            }
        }

        // [선생님이 요청하신 앱스스크립트 주소 적용 완료!]
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxLhH__yibJqs7QxehYF83xBcT_UTIQNBl5dOEnZRcjSqqcNcE59fnvhBPh-WizWEdT/exec";

        function sendToGoogleSheets(action, unit, mode) {
            if (!GAS_URL) return;

            const payload = {
                studentId: studentId,
                studentName: studentName,
                unit: unit,
                mode: mode,
                action: action
            };

            fetch(GAS_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify(payload)
            }).then(response => {
                console.log("데이터 전송 성공", payload);
            }).catch(error => {
                console.error("데이터 전송 실패", error);
            });
        }
    </script>
